<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Галерея</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <main class="container">
    <header>
      <h1>Photo<span>Wall</span></h1>
      <p id="counter">Фото: 0</p>
    </header>

    <section class="gallery" id="gallery"></section>

    <p class="status" id="status"></p>

    <div class="controls">
      <button id="loadBtn" class="btn btn-load">Завантажити ще 4</button>
      <button id="removeBtn" class="btn btn-remove">Видалити останню</button>
      <button id="reverseBtn" class="btn btn-reverse">Перевернути</button>
      <button id="clearBtn" class="btn btn-clear">Очистити</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
